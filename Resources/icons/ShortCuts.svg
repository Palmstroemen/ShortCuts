<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- ShortCuts addon icon: a keyboard with one highlighted key, using the
       overlay's own family palette (blue body, amber "plain" accent key). -->
  <rect x="4" y="16" width="56" height="34" rx="5" fill="#378ADD" stroke="#1f5c99" stroke-width="2"/>
  <g fill="#ffffff">
    <rect x="10" y="22" width="7" height="7" rx="1.5"/>
    <rect x="20" y="22" width="7" height="7" rx="1.5"/>
    <rect x="30" y="22" width="7" height="7" rx="1.5"/>
    <rect x="40" y="22" width="7" height="7" rx="1.5"/>
    <rect x="50" y="22" width="4" height="7" rx="1.5"/>
    <rect x="10" y="32" width="4" height="7" rx="1.5"/>
    <rect x="30" y="32" width="7" height="7" rx="1.5"/>
    <rect x="40" y="32" width="7" height="7" rx="1.5"/>
    <rect x="50" y="32" width="4" height="7" rx="1.5"/>
    <rect x="10" y="42" width="7" height="5" rx="1.5"/>
    <rect x="20" y="42" width="24" height="5" rx="1.5"/>
    <rect x="47" y="42" width="7" height="5" rx="1.5"/>
  </g>
  <!-- highlighted shortcut key -->
  <rect x="20" y="32" width="7" height="7" rx="1.5" fill="#D4B483"/>
</svg>
